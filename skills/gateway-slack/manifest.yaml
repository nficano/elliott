apiVersion: elliott/v1
kind: gateway
profile: gateway-standard
metadata: { namespace: core, name: gateway-slack, version: 2.0.0 }
spec:
  document: GATEWAY.md
  protocols: [message.source, message.sink, identity.resolver]
  capabilities:
    - { capability: network.connect, resources: [slack.com, slack-edge.com] }
    - { capability: secret.use, resources: [secret://gateways/slack] }
  egress: { class: declared, hosts: [slack.com, slack-edge.com] }
  isolation: container
  senderAllowlist: required
  outputTrust: untrusted
  topology:
    node:
      {
        id: gateway.slack,
        kind: gateway,
        domain: ingress,
        trustZone: external-untrusted,
        dataClassification: untrusted-external,
        criticality: path-critical,
      }
    dispatch: socket
    gate: config:channels.slack.enabled
    egressTargets: [Slack (Socket Mode + Web API)]
    edges:
      - {
          from: self,
          to: memory.evidence,
          kind: persist,
          protocol: "in-process (onFeedback -> #handleFeedback -> recordFeedback)",
          label: "feedback -> feedback table",
        }
  exports:
    - { ref: gateway/slack, implementation: src/index.ts }
