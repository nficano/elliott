apiVersion: elliott/v1
kind: gateway
profile: gateway-standard
metadata: { namespace: core, name: gateway-slack, version: 2.1.0 }
spec:
  document: SKILL.md
  protocols: [message.source, message.sink, identity.resolver]
  capabilities:
    # gateway.ts opens Socket Mode by connecting to whatever `url`
    # apps.connections.open (a slack.com Web API call) returns, not a hostname
    # our own code hardcodes. Slack serves those URLs from a fixed, documented
    # set of hosts — wss-primary and wss-backup for server clients, plus
    # wss-mobile for its mobile apps, which this gateway is not — published as
    # the domains to exempt from SSL-decrypting proxies at
    # https://slack.com/help/articles/360001603387. Both server hosts are
    # listed because the egress model here is exact-match only
    # (src/placement/egress.ts egressAllows), not domain-suffix matching: a
    # single guessed hostname denies the other half of the pair.
    - {
        capability: network.connect,
        resources: [
          slack.com,
          slack-edge.com,
          hooks.slack.com,
          wss-primary.slack.com,
          wss-backup.slack.com,
        ],
      }
    # secret://facilities/webhook is webhook-provisioner's internal
    # loopback-hop signing secret, not gateway-slack's own — the
    # interactivity route (below) verifies inbound forwards against it, so
    # it belongs in the declared inventory alongside the gateway's own
    # secret rather than being an undeclared read through context.settings.
    - {
        capability: secret.use,
        resources: [secret://gateways/slack, secret://facilities/webhook],
      }
    - {
        capability: facility.use,
        resources: ["facility://core/ingress.webhook@1"],
      }
  egress:
    {
      class: declared,
      hosts: [
        slack.com,
        slack-edge.com,
        hooks.slack.com,
        wss-primary.slack.com,
        wss-backup.slack.com,
      ],
    }
  isolation: container
  senderAllowlist: required
  outputTrust: untrusted
  topology:
    node:
      {
        id: gateway.slack,
        kind: gateway,
        domain: ingress,
        trustZone: external-untrusted,
        dataClassification: untrusted-external,
        criticality: path-critical,
      }
    dispatch: socket
    gate: config:channels.slack.enabled
    egressTargets: [Slack (Socket Mode + Web API)]
    edges:
      - {
          from: self,
          to: memory.evidence,
          kind: persist,
          protocol: "in-process (onFeedback -> #handleFeedback -> recordFeedback)",
          label: "feedback -> feedback table",
        }
  exports:
    - { ref: gateway/slack, implementation: src/index.ts }
