# Source of truth for the shared Slack app, applied by pasting this file into
# the app's App Manifest page (api.slack.com/apps -> App Manifest). Slack
# applies it VERBATIM: dropping an event subscription here disconnects that
# surface in production the moment the manifest is saved, while the Socket
# Mode connection keeps reporting healthy. evals/slack-app-manifest.test.ts
# pins this file to the events and scopes the gateway source requires.
_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: Elliott
  description: A secure personal agent that researches, plans, and acts with you.
  background_color: "#172B4D"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: >-
      Elliott is a secure personal agent that can search Slack in real time,
      work from the context you are viewing, use connected tools, show its
      progress, and return cited, actionable answers.
    actions:
      - name: Search Slack
        description: Find relevant messages, files, and channels in real time.
      - name: Work from context
        description: Summarize or act on the Slack item you are currently viewing.
      - name: Plan and execute
        description: Break a goal into visible steps and use connected tools.
    suggested_prompts:
      - title: Find something in Slack
        message: Search Slack for the latest relevant information about a topic I will provide.
      - title: Plan a task
        message: Help me turn a goal into a concrete plan, then carry out the steps I approve.
      - title: What can you do?
        message: Give me a concise overview of your connected tools and capabilities.
  bot_user:
    display_name: Elliott
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - chat:write
      - chat:write.customize
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - search:read.files
      - search:read.public
      - search:read.users
      - users:read
    user:
      - search:read.files
      - search:read.im
      - search:read.mpim
      - search:read.private
      - search:read.public
      - search:read.users

settings:
  event_subscriptions:
    # Message events cover every surface the gateway answers on. An earlier
    # revision listed only message.im; applying it unsubscribed channel
    # messages and the agent went silent in channels for days (2026-07-29).
    bot_events:
      - app_context_changed
      - app_home_opened
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
