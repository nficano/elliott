apiVersion: elliott/v1
kind: extension
profile: extension-standard
metadata: { namespace: core, name: browser, version: 1.0.0 }
spec:
  document: EXTENSION.md
  protocols: [tool.executor]
  capabilities:
    - { capability: network.connect, resources: [declared://task-hosts] }
  egress: { class: declared, hosts: [] }
  isolation: container
  outputTrust: untrusted
  companions:
    - name: chromium
      image: ghcr.io/browserless/chromium@sha256:operator-pinned
      egress: { class: declared, hosts: [] }
      endpoint: cdp
      volumes: [{ tmpfs: /profile }]
  topology:
    node: { id: tool.browser, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: untrusted-external, criticality: supporting }
    dispatch: tool
    gate: always
    egressTargets: [ browserless companion daemon ]
    edges:
      - { from: self, to: container.browser, kind: data, protocol: "http /content,/scrape (daemon->Chrome CDP)", label: render/scrape }
  exports:
    - { ref: tool/browser, implementation: src/index.ts }
