apiVersion: elliott/v1
kind: extension
profile: extension-standard
metadata: { namespace: core, name: youtube-dvr, version: 1.0.0 }
spec:
  document: EXTENSION.md
  protocols: [tool.executor]
  capabilities:
    - { capability: network.connect, resources: [youtube.googleapis.com, oauth2.googleapis.com] }
    - { capability: secret.use, resources: [secret://youtube/oauth] }
  egress: { class: declared, hosts: [youtube.googleapis.com, oauth2.googleapis.com] }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: service.youtube-dvr, kind: service, domain: external-integrations, trustZone: egress, dataClassification: owner-pii, criticality: supporting }
    dispatch: tool
    gate: "secret:youtube"
    egressTargets: [ YouTube Data API, Google OAuth ]
    edges:
      - { from: tool.pakman, to: self, kind: data, protocol: "in-process (source provider resolve)", label: latest full-episode URL }
      - { from: self, to: youtube.data-api, kind: data, protocol: "https (OAuth refresh token)", label: create/append dated playlist }
  exports:
    - { ref: extension/youtube-dvr, implementation: src/index.ts }
