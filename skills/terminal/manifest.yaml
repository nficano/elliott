apiVersion: elliott/v1
kind: tool
profile: tool-local-only
metadata: { namespace: core, name: terminal, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [tool.executor]
  capabilities:
    - { capability: process.execute, resources: [declared://executables] }
  egress: { class: none }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.terminal, kind: tool, domain: tool-execution, trustZone: sandboxed, dataClassification: internal, criticality: supporting }
    dispatch: tool
    gate: "config:tools.terminal.enabled"
    egressTargets: []
  exports:
    - { ref: tool/terminal, implementation: src/index.ts }
