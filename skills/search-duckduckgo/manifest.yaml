apiVersion: elliott/v1
kind: tool
profile: tool-standard
metadata: { namespace: core, name: search-duckduckgo, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [search.provider]
  capabilities:
    - { capability: network.connect, resources: [html.duckduckgo.com] }
  egress: { class: declared, hosts: [html.duckduckgo.com] }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.search-duckduckgo, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: untrusted-external, criticality: supporting }
    dispatch: tool
    gate: "config:tools.search_duckduckgo.enabled"
    egressTargets: [ DuckDuckGo ]
  exports:
    - { ref: tool/duckduckgo-search, implementation: src/index.ts }
