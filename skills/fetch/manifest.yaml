apiVersion: elliott/v1
kind: tool
profile: tool-standard
metadata: { namespace: core, name: fetch, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [tool.executor, content.extractor]
  capabilities:
    - { capability: network.connect, resources: [declared://request-hosts] }
  egress: { class: declared, hosts: [] }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.fetch, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: untrusted-external, criticality: supporting }
    dispatch: tool
    gate: always
    egressTargets: [ public http/https ]
  exports:
    - { ref: tool/fetch-url, implementation: src/index.ts }
