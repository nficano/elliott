apiVersion: elliott/v1
kind: extension
profile: extension-standard
metadata: { namespace: core, name: news-brief, version: 1.0.0 }
spec:
  document: EXTENSION.md
  protocols: [content.extractor]
  capabilities:
    # Egress hosts for the default sources; adding custom RSS feeds on other
    # hosts requires extending this grant.
    - { capability: network.connect, resources: [www.reddit.com, content.guardianapis.com, feeds.bbci.co.uk, feeds.apnews.com, feeds.reuters.com, newsdata.io, gnews.io] }
    - { capability: secret.use, resources: [secret://news-brief/guardian/api-key, secret://news-brief/newsdata/api-key, secret://news-brief/gnews/api-key] }
  egress: { class: declared, hosts: [www.reddit.com, content.guardianapis.com, feeds.bbci.co.uk, feeds.apnews.com, feeds.reuters.com, newsdata.io, gnews.io] }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: extension.news-brief, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: untrusted-external, criticality: supporting }
    dispatch: tool
    gate: "config:skills.news_brief.enabled"
    egressTargets: [ Reddit, The Guardian, RSS wires, NewsData.io, GNews ]
    edges:
      - { from: self, to: gateway.slack, kind: data, protocol: "in-process (context.deliver -> #deliver -> primaryGateway.send)", label: breaking alert (outbound) }
  exports:
    - { ref: extension/news-brief, implementation: src/index.ts }
