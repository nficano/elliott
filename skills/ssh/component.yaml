apiVersion: elliott/v1
kind: tool
profile: tool-standard
metadata: { namespace: core, name: ssh, version: 1.0.0 }
spec:
  document: TOOL.md
  protocols: [tool.executor]
  capabilities:
    - { capability: network.connect, resources: [declared://ssh-hosts] }
    - { capability: secret.use, resources: [secret://tools/ssh/agent] }
  egress: { class: declared, hosts: [] }
  isolation: container
  outputTrust: untrusted
  exports:
    - { ref: tool/ssh, implementation: src/index.ts }
