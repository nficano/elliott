apiVersion: elliott/v1
kind: evaluator
profile: evaluator-code-isolated
metadata: { namespace: organization, name: evaluator-darwinian, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [optimization.engine]
  capabilities: []
  egress: { class: none }
  isolation: container
  outputTrust: untrusted
  companions:
    - name: darwinian-evolver
      image: elliott/evaluator-darwinian@sha256:462ca94d9682b15ac6fb31a31db705f792f7d51855947f748c11a66da08bac52
      endpoint: http://127.0.0.1:9072
      egress: { class: none }
      volumes: []
  topology:
    node: { id: evaluator.darwinian, kind: evaluator, domain: self-evolution, trustZone: egress, dataClassification: internal, criticality: latent }
    dispatch: none
    gate: "config:evolution.darwinianEndpoint"
    egressTargets: [ "darwinian companion (HTTP, sealed OCI)" ]
    edges:
      - { from: evaluator.gauntlet, to: self, kind: learn, protocol: "http (POST, conditional on *_URL)", label: evolve }
  exports:
    - { ref: evaluator/darwinian, implementation: src/index.ts }
