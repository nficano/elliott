apiVersion: elliott/v1
kind: tool
profile: tool-standard
metadata: { namespace: core, name: web-firecrawl, version: 1.0.0 }
spec:
  document: TOOL.md
  protocols: [search.provider, content.extractor]
  capabilities:
    - { capability: network.connect, resources: [api.firecrawl.dev] }
    - { capability: secret.use, resources: [secret://web/firecrawl/api-key] }
  egress: { class: declared, hosts: [api.firecrawl.dev] }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.firecrawl, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: untrusted-external, criticality: supporting }
    dispatch: tool
    gate: "secret:firecrawlApiKey"
    egressTargets: [ Firecrawl API ]
  exports:
    - { ref: tool/firecrawl, implementation: src/index.ts }
