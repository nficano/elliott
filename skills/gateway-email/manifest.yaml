apiVersion: elliott/v1
kind: tool
profile: tool-standard
metadata:
  namespace: core
  name: gateway-email
  version: 1.0.0
spec:
  document: SKILL.md
  # Send-only: register() provides email_send and nothing else — no gateway,
  # no inbound route, no identity resolution. message.source and
  # identity.resolver were carried over from the original registry manifest,
  # which advertised (and SKILL.md documented) an IMAP receive path that was
  # never implemented. Corrected to what the code actually does; IMAP
  # receive would be new scope, not a fix.
  protocols:
    - message.sink
  capabilities:
    - capability: network.connect
      resources:
        - 'declared://mail-hosts'
    - capability: secret.use
      resources:
        - 'secret://gateways/email'
  egress:
    class: declared
    hosts: []
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.email, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: owner-pii, criticality: supporting }
    dispatch: tool
    gate: "secret:smtp"
    egressTargets: [ SMTP ]
  exports:
    - ref: tool/email-send
      implementation: src/index.ts
