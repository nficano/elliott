apiVersion: elliott/v1
kind: gateway
profile: gateway-standard
metadata: { namespace: core, name: gateway-gmail, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [message.source, message.sink, identity.resolver]
  capabilities:
    - { capability: network.connect, resources: [gmail.googleapis.com, oauth2.googleapis.com, declared://unsubscribe-targets] }
    - { capability: secret.use, resources: [secret://gateways/gmail] }
    - { capability: fs.read, resources: [state://gmail-webhook-anchors.json] }
    - { capability: fs.write, resources: [state://gmail-webhook-anchors.json] }
  # gmail.googleapis.com and oauth2.googleapis.com are the two fixed,
  # hardcoded API hosts every tool uses (client.ts's API_BASE, auth.ts's
  # TOKEN_URL) — enumerable and listed below. email_unsubscribe additionally
  # follows a sender-controlled List-Unsubscribe URL, which by design is not
  # restricted to Google's domains and cannot be added to this static list;
  # publicUrl()/fetchPublicUrl() enforce the SSRF boundary for that one path
  # at the code level (src/runtime/skills/http.ts), the same "dynamic public
  # destination" guard the fetch skill relies on for the same reason.
  egress: { class: declared, hosts: [gmail.googleapis.com, oauth2.googleapis.com] }
  isolation: container
  senderAllowlist: required
  outputTrust: untrusted
  topology:
    node: { id: tool.gmail, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: owner-pii, criticality: supporting }
    dispatch: tool
    gate: "secret:gmail"
    egressTargets: [ Gmail API, public web (List-Unsubscribe, SSRF-guarded) ]
  exports:
    - { ref: gateway/gmail, implementation: src/index.ts }
