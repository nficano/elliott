apiVersion: elliott/v1
kind: extension
profile: extension-standard
metadata: { namespace: core, name: telemetry-map, version: 1.0.0 }
spec:
  document: EXTENSION.md
  protocols: [health.checker]
  capabilities:
    - { capability: fs.read, resources: [state://sessions.sqlite] }
    - {
        capability: facility.use,
        resources:
          ["facility://core/proxy.route@1", "facility://core/dns.local@1"],
      }
  egress: { class: none }
  isolation: container
  topology:
    node: { id: obs.map, kind: observability, domain: observability, trustZone: edge, dataClassification: operational-metadata, criticality: supporting }
    dispatch: none
    gate: always
    egressTargets: []
    edges:
      - { from: obs.telemetry, to: self, kind: data, protocol: "in-process subscribe -> SSE", label: "subscribe -> stream" }
      - { from: self, to: obs.telemetry, kind: control, protocol: in-process (bus.emit), label: emit db.write/heartbeat }
      - { from: database.sessions, to: self, kind: data, protocol: sqlite (readonly tail), label: read-only tail }
      - { from: runtime.http, to: self, kind: data, protocol: in-process route dispatch, label: serve map routes }
      - { from: self, to: container.elliott, kind: health, protocol: in-process (bundled skill), label: runs inside }
  exports:
    - { ref: extension/telemetry-map, implementation: src/index.ts }
