apiVersion: elliott/v1
kind: evaluator
profile: evaluator-isolated
metadata: { namespace: organization, name: evaluator-dspy, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [optimization.engine, evaluation.runner]
  capabilities: []
  egress: { class: none }
  isolation: container
  outputTrust: untrusted
  companions:
    - name: dspy-optimizer
      image: elliott/evaluator-dspy@sha256:9a56cbea5cd27a50b00392421b9ad82a315de238350ffd8ac403336fc6d700ef
      endpoint: http://127.0.0.1:9071
      egress: { class: none }
      volumes: []
  topology:
    node: { id: evaluator.dspy, kind: evaluator, domain: self-evolution, trustZone: egress, dataClassification: internal, criticality: latent }
    dispatch: none
    gate: "config:evolution.dspyEndpoint"
    egressTargets: [ "dspy companion (HTTP, sealed OCI)" ]
    edges:
      - { from: evaluator.gauntlet, to: self, kind: learn, protocol: "http (POST, conditional on *_URL)", label: optimize }
  exports:
    - { ref: evaluator/dspy, implementation: src/index.ts }
