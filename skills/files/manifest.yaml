apiVersion: elliott/v1
kind: tool
profile: tool-local-only
metadata: { namespace: core, name: files, version: 1.0.0 }
spec:
  document: TOOL.md
  protocols: [resource.reader, resource.writer]
  capabilities:
    - { capability: fs.read, resources: [workspace://granted-paths] }
    - { capability: fs.write, resources: [workspace://granted-paths] }
  egress: { class: none }
  isolation: container
  outputTrust: untrusted
  topology:
    node: { id: tool.files, kind: tool, domain: tool-execution, trustZone: sandboxed, dataClassification: user-content, criticality: supporting }
    dispatch: tool
    gate: "config:tools.files.enabled"
    egressTargets: []
  exports:
    - { ref: tool/files, implementation: src/index.ts }
