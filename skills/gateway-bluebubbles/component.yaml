apiVersion: elliott/v1
kind: gateway
profile: gateway-standard
metadata: { namespace: core, name: gateway-bluebubbles, version: 1.0.0 }
spec:
  document: GATEWAY.md
  protocols: [message.source, message.sink, identity.resolver]
  capabilities:
    - { capability: network.connect, resources: [lan://bluebubbles] }
    - { capability: secret.use, resources: [secret://gateways/bluebubbles] }
  egress: { class: lan }
  isolation: remote
  senderAllowlist: required
  outputTrust: untrusted
  topology:
    node: { id: tool.imessage, kind: tool, domain: external-integrations, trustZone: egress, dataClassification: owner-pii, criticality: supporting }
    dispatch: tool
    gate: "secret:bluebubbles"
    egressTargets: [ BlueBubbles server ]
  exports:
    - { ref: gateway/bluebubbles, implementation: src/index.ts }
