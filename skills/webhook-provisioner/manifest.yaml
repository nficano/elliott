apiVersion: elliott/v1
kind: extension
profile: extension-standard
metadata: { namespace: core, name: webhook-provisioner, version: 1.0.0 }
spec:
  document: SKILL.md
  protocols: [facility.provider]
  provides:
    - { facility: ingress.webhook, version: 1 }
  capabilities:
    - { capability: network.connect, resources: [loopback://runtime-http] }
    - { capability: secret.use, resources: [secret://facilities/webhook] }
    - { capability: fs.read, resources: [state://webhook-provisioner/endpoints.json] }
    - { capability: fs.write, resources: [state://webhook-provisioner/endpoints.json] }
  # Forwards verified payloads to the consumer's internal route over the
  # runtime's own loopback interface (src/*/routes.ts `forward()`) — real
  # network egress, just confined to the local process's own HTTP port, not
  # "none". `loopback` is the class this repo's placement/egress model
  # defines specifically for that case.
  egress: { class: loopback }
  isolation: container
  outputTrust: untrusted
  topology:
    node:
      {
        id: extension.webhook-provisioner,
        kind: extension,
        domain: ingress,
        trustZone: external-untrusted,
        dataClassification: untrusted-external,
        criticality: supporting,
      }
    dispatch: route
    gate: config
    egressTargets: []
    edges:
      - {
          from: self,
          to: runtime.http,
          kind: data,
          protocol: loopback POST with internal HMAC hop,
          label: forward verified webhook payloads,
        }
  exports:
    - { ref: extension/webhook-provisioner, implementation: src/index.ts }
