apiVersion: elliott/v1
engines:
  text:
    primary: organization/evaluator/dspy-gepa
    fallback: organization/evaluator/dspy-mipro
  code:
    primary: organization/evaluator/darwinian
budgets:
  perRun:
    candidates: 40
    tokens: 2000000
    costUsd: 25
    durationMinutes: 180
  monthly:
    costUsd: 200
evaluation:
  authoringProfile: deep
  judgingProfile: deep
  requireDistinctRoute: true
  split:
    train: 0.6
    validation: 0.2
    holdout: 0.2
continuous:
  enabled: false
  benchmarkCron: "0 3 * * 0"
  optimizationCron: "0 4 * * 0"
  maximumRiskClass: C2
  maximumConcurrentRuns: 1
targets:
  allow:
    - "workspace/skill/*"
    - "core/skill/*"
    - "core/tool/*"
    - "core/prompt/*"
    - "core/code/*"
  deny:
    - "core/policy/*"
    - "core/evaluator/*"
