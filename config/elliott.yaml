runtime:
  timezone: UTC
  http: { port: 8080 }

store:
  dsn: ${VAULT:secret/services/elliott#postgres_dsn}
  pool: { max: 10 }
  vectors: { dim: 768, type: vector }

llm:
  # Any OpenAI-compatible endpoint (a LiteLLM proxy, a provider's native
  # /v1, or a local server). Agent repos point this at their own gateway.
  base_url: http://localhost:4000/v1
  api_key: ${VAULT:secret/services/elliott#llm_api_key}
  max_parallel: 12
  models:
    utility: { model: tier-local, context_window: 32768 }
    trivial: { model: tier-local, context_window: 32768 }
    fast: { model: anthropic/claude-haiku-4-5, context_window: 200000 }
    standard: { model: anthropic/claude-sonnet-5, context_window: 200000 }
    deep: { model: anthropic/claude-opus-4-8, context_window: 200000 }
    embed: { model: tier-local-embed }
  profiles:
    default: { max_tokens: 4096, temperature: 0.4 }
    writing: { max_tokens: 32768, temperature: 0.7 }

budgets:
  cold_tokens_max: 12000
  monthly_usd_max: 200
  per_turn_usd_max: 2

observability:
  otel: { endpoint: http://localhost:4318 }
  glitchtip:
    dsn: ${VAULT:secret/services/elliott#glitchtip_dsn}
    environment: dev

notify:
  webhook_url: ""
  default_channels: []

tools:
  files:
    enabled: true
    root: .elliott-runtime/workspace
  terminal:
    enabled: false
    root: .elliott-runtime/workspace
    allowed_commands: []
  ssh:
    enabled: false
    user: elliott
    hosts: []

skills:
  deep_trace:
    # The observability map ships enabled and serves on the runtime HTTP port
    # at /v1/deeptrace. To publish it beyond localhost, provide
    # proxy.route / dns.local facilities (e.g. traefik + pihole skills) and
    # set the hostname the route should answer on:
    #
    # public_hostname: elliott.example.com
    # service_url: http://127.0.0.1:8080
    enabled: true
