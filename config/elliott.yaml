runtime:
  timezone: UTC
  http: { port: 8080 }

store:
  # Optional external Postgres store. Omit `dsn` to run on the embedded
  # SQLite default (TDD D-12). To enable:
  # dsn: ${ENV:ELLIOTT_POSTGRES_DSN}
  pool: { max: 10 }
  vectors: { dim: 768, type: vector }

llm:
  # Name a provider OR a base_url — one of the two is required, and a missing
  # both fails the boot naming them. No model ships as a default either.
  #
  #   provider: anthropic   -> https://api.anthropic.com/v1, native wire
  #                            (/messages, thinking, effort)
  #   provider: openai      -> https://api.openai.com/v1, /chat/completions
  #   base_url: <url>       -> any OpenAI-compatible endpoint (LiteLLM proxy,
  #                            Ollama, a vendor /v1). No provider needed.
  #
  # Setting both is valid and means "this provider's protocol, my host" — for
  # an Anthropic-speaking gateway on a private URL. elliott never infers a
  # provider from the key or the model name: a wrong guess would ship prompts
  # to a vendor you did not choose.
  provider: ${ENV:ELLIOTT_LLM_PROVIDER} # anthropic | openai
  # base_url: ${ENV:ELLIOTT_LLM_BASE_URL} # e.g. https://api.example.com/v1
  api_key: ${ENV:ELLIOTT_LLM_API_KEY}
  max_parallel: 12
  models:
    # Agents select a tier by name (spec.modelProfile), never a hardcoded
    # model. Add tiers (fast, standard, deep, …) as your deployment needs.
    default:
      model: ${ENV:ELLIOTT_LLM_MODEL}
      context_window: 128000
  profiles:
    # `thinking` and `effort` are optional; unset leaves each model's own
    # default in force. Both reach Anthropic natively (thinking block +
    # output_config.effort); on the OpenAI wire `effort` maps to
    # reasoning_effort and is sent only when set. `temperature` applies to the
    # OpenAI wire only — current Anthropic models reject sampling parameters,
    # so the native wire omits it.
    default: { max_tokens: 4096, temperature: 0.4 }
    # default: { max_tokens: 4096, thinking: adaptive, effort: high }

budgets:
  cold_tokens_max: 12000
  monthly_usd_max: 200
  per_turn_usd_max: 2

observability:
  # Sentry-compatible error reporting (GlitchTip or Sentry). ON by default and
  # needs no setup: errors always log to the console, and with the bundled
  # collector companion running (deploy/compose.glitchtip.yml) they also ship
  # there automatically — zero wiring. To send to your own Sentry/GlitchTip,
  # set the ELLIOTT_GLITCHTIP_DSN env var (read directly, safe to leave unset)
  # or a `dsn:` reference below. The DSN is a secret, so like every
  # secret-bearing field it must be an opaque reference (${ENV:VAR} or
  # ${VAULT:mount/path#field}), never a literal — a literal here is a load-time
  # error. Use `enabled: false` to stay
  # console-only (nothing about glitchtip then loads). What ships off-box is a
  # message-free error skeleton (class + stack frames + mechanism) — the error
  # message, which could hold an interpolated secret, stays in the local console
  # and never crosses the process boundary.
  glitchtip:
    enabled: true
    # dsn: "${ENV:ELLIOTT_GLITCHTIP_DSN}"   # or "${VAULT:observability/glitchtip#dsn}"

notify:
  webhook_url: ""
  default_channels: []

tools:
  files:
    enabled: true
    root: .elliott-runtime/workspace
  terminal:
    enabled: false
    root: .elliott-runtime/workspace
    allowed_commands: []
  ssh:
    enabled: false
    user: elliott
    hosts: []
  # HashiCorp Vault, off by default. Enable it AND provide an address, a token
  # (secrets.yaml `vault_token`), and a non-empty `paths` allowlist — it fails
  # closed, so an empty allowlist leaves the skill unregistered.
  vault:
    enabled: false
    address: "" # e.g. https://vault.internal:8200
    paths: [] # full KV v2 API paths, e.g. secret/data/myapp

skills:
  deep_trace:
    # The observability map ships enabled and serves on the runtime HTTP port
    # at /v1/observability/map. To publish it beyond localhost, provide
    # proxy.route / dns.local facilities (e.g. traefik + pihole skills) and
    # set the hostname the route should answer on:
    #
    # public_hostname: elliott.example.com
    # service_url: http://127.0.0.1:8080
    enabled: true
