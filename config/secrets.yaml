# Named secrets the runtime resolves at boot and hands to components through
# the secret broker. Values are opaque references — `${VAULT:path#field}` for
# HashiCorp Vault KV, or `${ENV:VAR}` for process environment — never literal
# secrets. Agent repos ship their own secrets.yaml naming the keys their
# skills consume; this file lists only what the framework built-ins use.
ssh_private_key: ${VAULT:secret/services/elliott#ssh_private_key}
webhook_signing_secret: ${VAULT:secret/services/elliott#webhook_signing_secret}
