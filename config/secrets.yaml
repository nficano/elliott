# Named secrets the runtime resolves at boot and hands to components through
# the secret broker. Values are opaque references — `${ENV:VAR}` for the
# process environment (or the ELLIOTT_SECRETS_FILE mount), or
# `${VAULT:mount/path#field}` for HashiCorp Vault KV — never literal secrets.
# A reference that does not resolve is omitted, not fatal: the skills that
# need it stay unregistered while the rest of the runtime boots. Agent repos
# ship their own secrets.yaml naming the keys their skills consume; this file
# lists only what the framework built-ins use.
ssh_private_key: ${ENV:ELLIOTT_SSH_PRIVATE_KEY}
webhook_signing_secret: ${ENV:ELLIOTT_WEBHOOK_SIGNING_SECRET}
# Only when tools.vault.enabled — the token the vault skill reads with.
# vault_token: ${ENV:ELLIOTT_VAULT_TOKEN}
