[workspace]
members = ["core", "napi", "wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.0.0"

[workspace.dependencies]
aho-corasick = "1.1.3"
blake3 = "1.8.2"
napi = { version = "3.4.0", default-features = false, features = ["napi8"] }
napi-build = "2.3.2"
napi-derive = "3.3.0"
wasm-bindgen = "0.2.105"
