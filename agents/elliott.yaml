apiVersion: elliott/v1
kind: agent
metadata:
  namespace: workspace
  name: elliott
  version: 1.0.0
spec:
  persona: assets/prompts/elliott.md
  modelProfile: fast
  components:
    - core/gateway/gateway-slack
    - core/gateway/gateway-gmail
    - core/gateway/gateway-bluebubbles
    - core/gateway/gateway-webhook
    - core/gateway/gateway-home-assistant
    - core/mcp-endpoint/mcp-client
    - core/tool/search-duckduckgo
    - core/tool/search-brave
    - core/tool/web-firecrawl
    - core/tool/web-parallel
    - core/extension/browser
    - core/tool/fetch
    - core/scheduler/scheduler
  mcp:
    - id: h12o
      url: https://mcp.h12o.io/mcp
      transport: streamable-http
    - id: home-assistant
      url: http://172.16.10.235:8123/mcp_server/sse
      transport: sse
      authorizationSecret: ha_token
