[project]
name = "elliott-dspy-companion"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dspy==3.2.1",
]

[tool.uv]
package = false

# The worker imports elliott_companion from companions/common via PYTHONPATH in
# the image/check script; point basedpyright at the same layout for local IDE.
# Use the local uv venv so dspy's real exports (Signature, LM, GEPA, …) resolve.
[tool.basedpyright]
extraPaths = ["../common", "../typings"]
stubPath = "../typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
