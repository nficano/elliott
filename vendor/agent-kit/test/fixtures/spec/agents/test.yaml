# Fixture agent spec — exercises persona assets, model tiers + per-job
# override, config interpolation, permissions, tool imports (builtin + local),
# secrets binding, and a scheduled 3-step job with chained outputs.
name: test-agent
persona: assets/prompts/test.md
channels: [telegram]

model:
  default: fast
  daily-brief: standard

config:
  channels: [alpha, beta]
  greeting: hello

permissions:
  local-echo: write
  webpage: read

tools:
  - uses: webpage
  - uses: ./skills/local-echo
    with: { approval: auto }
    secrets:
      token: ${{ secrets.echo_token }}

jobs:
  daily-brief:
    on: { schedule: "0 7 * * *" }
    steps:
      - id: fetch
        uses: ./skills/local-echo
        with:
          items: ${{ config.channels }}
          note: prefix ${{ config.greeting }} suffix
      - turn:
          prompt: prompts/brief.md
          context:
            fetched: ${{ steps.fetch.outputs }}
      - id: send
        uses: ./skills/local-echo
        with:
          body: ${{ steps.turn.outputs.text }}

  manual-poke:
    on: { manual: true }
    steps:
      - uses: ./skills/local-echo
