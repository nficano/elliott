name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (e.g. new push to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.posture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        posture: [standard, hardened, regulated]
    env:
      ELLIOTT_POSTURE: ${{ matrix.posture }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run footprint:check
      - run: bun run hot-core:check
      - run: cargo fmt --manifest-path crates/hot-core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/hot-core/Cargo.toml --workspace --all-targets -- -D warnings

  deploy:
    name: Deploy to spruce
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runs on a self-hosted runner inside the LAN — cloud runners cannot
    # reach Vault (172.16.x) or the spruce SSH host. Register a runner with
    # the `spruce-deploy` label (see scripts/deploy-spruce.sh header).
    runs-on: [self-hosted, spruce-deploy]
    concurrency:
      # Serialize deploys; never interrupt an in-flight rsync/compose-up.
      group: deploy-spruce
      cancel-in-progress: false
    env:
      SPRUCE_HOST: ${{ vars.SPRUCE_HOST || 'spruce' }}
      ELLIOTT_REMOTE_DIR: ${{ vars.ELLIOTT_REMOTE_DIR || '/Users/nficano/code/elliott' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Vault (AppRole)
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          echo "VAULT_ADDR=$VAULT_ADDR" >> "$GITHUB_ENV"
          token="$(vault write -field=token auth/approle/login \
            role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")"
          echo "::add-mask::$token"
          echo "VAULT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy and verify
        run: scripts/deploy-spruce.sh
