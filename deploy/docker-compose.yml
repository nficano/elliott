name: elliott

services:
  elliott:
    image: elliott:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: elliott
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: ["${ELLIOTT_ENV_FILE:-.env}"]
    environment:
      TZ: America/New_York
      ELLIOTT_ENV: prod
      ELLIOTT_RELEASE: ${ELLIOTT_RELEASE:-dev}
      HOME: /app/.elliott-runtime
      XDG_CACHE_HOME: /app/.elliott-runtime/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, browser, evolution]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/data:size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      # Reminder state and the files-tool workspace promise to survive runtime
      # restarts and container replacement.
      - elliott-runtime:/app/.elliott-runtime
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  postgres:
    image: pgvector/pgvector:pg16
    container_name: elliott-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oslo
      POSTGRES_USER: oslo
      POSTGRES_PASSWORD: ${postgres_password:?rendered from Vault}
    volumes:
      - elliott-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oslo -d oslo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution companions: language-neutral optimizer/evaluator boundaries the
  # runtime reaches over the internal `evolution` network. The optimizers run
  # real model calls through loopback proxy sidecars (below) that hold the
  # LiteLLM credential; the benchmarks image stays in fixture mode until the
  # evaluation/code-check/benchmark executors exist.
  evolution-dspy:
    image: elliott/evaluator-dspy:local
    container_name: elliott-evolution-dspy
    restart: unless-stopped
    environment:
      ELLIOTT_MODEL_PROXY_ENDPOINT: "http://127.0.0.1:9090/v1"
      ELLIOTT_MODEL_PROXY_TOKEN: ${ELLIOTT_MODEL_PROXY_TOKEN_DSPY:?rendered from Vault}
      ELLIOTT_DSPY_MODEL: "openai/tier-standard"
    networks: [evolution, default]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9071/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  evolution-darwinian:
    image: elliott/evaluator-darwinian:local
    container_name: elliott-evolution-darwinian
    restart: unless-stopped
    environment:
      ELLIOTT_MODEL_PROXY_ENDPOINT: "http://127.0.0.1:9090/v1"
      ELLIOTT_MODEL_PROXY_TOKEN: ${ELLIOTT_MODEL_PROXY_TOKEN_DARWINIAN:?rendered from Vault}
      ELLIOTT_DARWINIAN_MODEL: "tier-standard"
      ELLIOTT_MODEL_PROXY_INPUT_USD_PER_MILLION: "3"
      ELLIOTT_MODEL_PROXY_OUTPUT_USD_PER_MILLION: "15"
    networks: [evolution, default]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9072/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # Loopback model proxies: one per optimizer, sharing that companion's
  # network namespace so the worker's mandatory 127.0.0.1 endpoint check
  # holds. The upstream LiteLLM key lives only here, never in the sealed
  # companion image.
  evolution-dspy-proxy:
    image: elliott/model-proxy:local
    container_name: elliott-evolution-dspy-proxy
    restart: unless-stopped
    network_mode: "service:evolution-dspy"
    depends_on: [evolution-dspy]
    environment:
      ELLIOTT_PROXY_PORT: "9090"
      ELLIOTT_PROXY_TOKEN: ${ELLIOTT_MODEL_PROXY_TOKEN_DSPY:?rendered from Vault}
      ELLIOTT_PROXY_UPSTREAM: ${ELLIOTT_MODEL_PROXY_UPSTREAM:-https://litellm.h12o.io}
      ELLIOTT_PROXY_UPSTREAM_KEY: ${litellm_key:?rendered from Vault}
      ELLIOTT_PROXY_ALLOWED_MODELS: "tier-standard"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  evolution-darwinian-proxy:
    image: elliott/model-proxy:local
    container_name: elliott-evolution-darwinian-proxy
    restart: unless-stopped
    network_mode: "service:evolution-darwinian"
    depends_on: [evolution-darwinian]
    environment:
      ELLIOTT_PROXY_PORT: "9090"
      ELLIOTT_PROXY_TOKEN: ${ELLIOTT_MODEL_PROXY_TOKEN_DARWINIAN:?rendered from Vault}
      ELLIOTT_PROXY_UPSTREAM: ${ELLIOTT_MODEL_PROXY_UPSTREAM:-https://litellm.h12o.io}
      ELLIOTT_PROXY_UPSTREAM_KEY: ${litellm_key:?rendered from Vault}
      ELLIOTT_PROXY_ALLOWED_MODELS: "tier-standard"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # Loopback bridges: companion job servers refuse to bind anything but
  # 127.0.0.1, so each companion gets a netns sidecar that listens on the
  # container's external interface (:19xxx) and pipes to the loopback port.
  # The runtime's ELLIOTT_EVOLUTION_*_URL values point at these.
  evolution-dspy-bridge:
    image: elliott/loopback-bridge:local
    container_name: elliott-evolution-dspy-bridge
    restart: unless-stopped
    network_mode: "service:evolution-dspy"
    depends_on: [evolution-dspy]
    environment:
      ELLIOTT_BRIDGE_LISTEN_PORT: "19071"
      ELLIOTT_BRIDGE_TARGET_PORT: "9071"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:19071/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  evolution-darwinian-bridge:
    image: elliott/loopback-bridge:local
    container_name: elliott-evolution-darwinian-bridge
    restart: unless-stopped
    network_mode: "service:evolution-darwinian"
    depends_on: [evolution-darwinian]
    environment:
      ELLIOTT_BRIDGE_LISTEN_PORT: "19072"
      ELLIOTT_BRIDGE_TARGET_PORT: "9072"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:19072/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  evolution-benchmarks-bridge:
    image: elliott/loopback-bridge:local
    container_name: elliott-evolution-benchmarks-bridge
    restart: unless-stopped
    network_mode: "service:evolution-benchmarks"
    depends_on: [evolution-benchmarks]
    environment:
      ELLIOTT_BRIDGE_LISTEN_PORT: "19073"
      ELLIOTT_BRIDGE_TARGET_PORT: "9073"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:19073/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # Promotion canary: the runtime POSTs the pending release here; the canary
  # verifies the live runtime still completes a real agent turn and echoes
  # the release snapshotId. Candidate quality is gated by the evaluation
  # report and human proposal approval, not by this probe.
  evolution-canary:
    image: elliott/evolution-canary:local
    container_name: elliott-evolution-canary
    restart: unless-stopped
    environment:
      ELLIOTT_RUNTIME_URL: "http://elliott:8080"
    networks: [default]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  evolution-benchmarks:
    image: elliott/evaluator-agent-benchmarks:local
    container_name: elliott-evolution-benchmarks
    restart: unless-stopped
    environment:
      ELLIOTT_COMPANION_FIXTURE: "1"
    networks: [evolution]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9073/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  agent-browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: elliott-browser
    restart: unless-stopped
    shm_size: 1gb
    environment:
      TOKEN: ${browser_token:?rendered from Vault}
      PORT: "3000"
      CONCURRENT: "3"
      TIMEOUT: "60000"
    networks: [browser]

networks:
  default:
  browser:
  # Internal-only: companions get no route to the internet; the runtime
  # reaches them by service name, nothing else can.
  evolution:
    internal: true

volumes:
  elliott-postgres:
  elliott-runtime:
